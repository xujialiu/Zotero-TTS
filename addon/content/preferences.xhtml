<!-- Initialization must hang off this onload, not off a pane script:
     Zotero runs pane `scripts` BEFORE it parses and inserts this fragment
     (preferences.js: loadSubScript, then parseXULToFragment / append),
     and only afterwards dispatches a `load` event to the fragment's root.
     A script would find none of these elements. -->
<vbox class="ztts-pane" onload="Zotero.ZoteroTTS.prefsPane.onPaneLoad(document)">
  <!-- The pane's every string is in locale/<locale>/zotero-tts.ftl (issue
       #30): Zotero registers a plugin's Fluent files at startup, this link
       adds ours to the settings window, and Zotero translates every
       data-l10n-id below before it dispatches the load event above — so the
       markup carries no text of its own. An attribute of ours (help, bold)
       is translated only when data-l10n-attrs names it; a ? label keeps
       its ? because its message says .value = ? (Fluent drops the
       localizable attributes a message leaves out). -->
  <linkset>
    <html:link rel="localization" href="zotero-tts.ftl"/>
  </linkset>
  <!-- ui/help-tips.ts appends the tooltip the ? icons open here: an icon's
       text is its `help` attribute, shown the moment the mouse is on it —
       Zotero's own tooltips wait ui.tooltip.delay_ms. The class scopes
       preferences.css. -->
  <popupset id="ztts-popupset"/>
  <!-- One groupbox per provider, wired by ui/provider-rows.ts: Enable runs
       the connection check and switches the provider on only when it
       passes, locking the fields; Disable unlocks them. Test connection
       probes without switching. Both write to the description beside them.
       The switch's label is painted by provider-rows on load (Enable or
       Disable, by the pref), so it carries none here. -->
  <groupbox id="ztts-provider-openai">
    <label><html:h2>OpenAI</html:h2></label>
    <!-- Not bound with preference=: server-preset-rows.ts writes the choice
         and the preset's defaults, grays out the fields the server ignores,
         and puts the preset's note into the ? beside the dropdown (its
         `help` attribute). The ? icons are styled by preferences.css. -->
    <hbox align="center">
      <label data-l10n-id="ztts-field-server" style="width: 8em"/>
      <menulist id="ztts-openai-server">
        <menupopup>
          <menuitem value="openai" label="OpenAI"/>
          <menuitem value="chatterbox" label="Chatterbox-TTS-Server"/>
          <menuitem value="other" data-l10n-id="ztts-server-other"/>
        </menupopup>
      </menulist>
      <label id="ztts-openai-server-help" class="ztts-help" value="?"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-api-key" style="width: 8em"/>
      <html:input id="ztts-openai-apiKey" type="password" preference="extensions.zotero.zotero-tts.openai.apiKey"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-base-url" style="width: 8em"/>
      <html:input id="ztts-openai-baseURL" type="text" preference="extensions.zotero.zotero-tts.openai.baseURL"/>
    </hbox>
    <!-- Free text: any OpenAI-compatible server names its models as it
         likes. Test connection fills the datalist with the server's list. -->
    <hbox align="center">
      <label data-l10n-id="ztts-field-model" style="width: 8em"/>
      <html:input id="ztts-openai-model" type="text" list="ztts-openai-models" preference="extensions.zotero.zotero-tts.openai.model"/>
      <html:datalist id="ztts-openai-models"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-voices" style="width: 8em"/>
      <html:input id="ztts-openai-voices" type="text" data-l10n-id="ztts-openai-voices-input" preference="extensions.zotero.zotero-tts.openai.voices"/>
    </hbox>
    <!-- For a gateway in front of a keyless server, e.g. a Cloudflare Access
         service token: "CF-Access-Client-Id: ...; CF-Access-Client-Secret: ..."
         Masked like the keys (issue #19): it is a credential, and a pane in a
         screen share or a screenshot showed it in full. Gecko's own reveal
         button reads it back while the section is unlocked for editing, and
         is inert once the provider is on — which is when it should be. The
         placeholder is the format, the same in every language. -->
    <hbox align="center">
      <label data-l10n-id="ztts-field-extra-headers" style="width: 8em"/>
      <html:input id="ztts-openai-headers" type="password" placeholder="Name: value; Name: value" preference="extensions.zotero.zotero-tts.openai.headers"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-extra-headers" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-enable-openai"/>
      <button id="ztts-test-openai" data-l10n-id="ztts-test-connection"/>
      <description id="ztts-test-result-openai"/>
    </hbox>
  </groupbox>

  <groupbox id="ztts-provider-azure">
    <label><html:h2>Azure</html:h2></label>
    <hbox align="center">
      <label data-l10n-id="ztts-field-api-key" style="width: 8em"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.azure.apiKey"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-region" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.azure.region"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-enable-azure"/>
      <button id="ztts-test-azure" data-l10n-id="ztts-test-connection"/>
      <description id="ztts-test-result-azure"/>
    </hbox>
  </groupbox>

  <groupbox id="ztts-provider-local">
    <!-- One block per engine: its own switch and address. Only Kokoro
         exists today; the heading is filled from the engine registry in
         onPaneLoad. -->
    <label><html:h2 id="ztts-local-heading"/></label>
    <hbox align="center">
      <label data-l10n-id="ztts-field-address" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.local.baseURL"/>
    </hbox>
    <!-- Same format as the OpenAI section's, and masked for the same
         reason: for a gateway in front of the server, e.g. a Cloudflare
         Access service token. -->
    <hbox align="center">
      <label data-l10n-id="ztts-field-extra-headers" style="width: 8em"/>
      <html:input type="password" placeholder="Name: value; Name: value" preference="extensions.zotero.zotero-tts.local.headers"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-extra-headers" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-enable-local"/>
      <button id="ztts-test-local" data-l10n-id="ztts-test-connection"/>
      <description id="ztts-test-result-local"/>
    </hbox>
  </groupbox>

  <!-- The operating system's own voices, synthesized by the plugin through a
       helper process, so they are ordinary plugin voices (issue #12). No
       fields: there is no key and no address. Zotero's own copies of the same
       voices are never listed beside these: the reader drops them either way
       (read-aloud/system-voices.ts, issue #17). -->
  <groupbox id="ztts-provider-system">
    <label><html:h2 data-l10n-id="ztts-heading-system-voices"/></label>
    <hbox align="center">
      <description id="ztts-system-note" data-l10n-id="ztts-system-note"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-system-voices" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-enable-system"/>
      <button id="ztts-test-system" data-l10n-id="ztts-test-connection"/>
      <description id="ztts-test-result-system"/>
    </hbox>
  </groupbox>

  <!-- Every voice the enabled providers publish, grouped by language, with a
       sample player and favorites; wired by ui/voice-browser-rows.ts. Listed
       on load and again whenever a provider switch above is used. -->
  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-voice-browser"/></label>
    <hbox align="center">
      <!-- Unbound, and written by ui/voice-list-switches.ts: a bound
           checkbox writes the pref before any listener can refuse it. The
           message's .bold names the run of its .label drawn in bold
           (ui/bold-labels.ts). -->
      <checkbox id="ztts-favorites-only" data-l10n-id="ztts-favorites-only" data-l10n-attrs="bold"/>
    </hbox>
    <!-- The Read Aloud popup's own speed slider (0.5–3.0 by 0.1): the samples
         play at this speed, and releasing it makes it the speed Read Aloud
         starts with (read-aloud/default-speed.ts) -->
    <hbox align="center">
      <label data-l10n-id="ztts-voices-speed" control="ztts-voices-speed"/>
      <html:input type="range" id="ztts-voices-speed" min="0.5" max="3" step="0.1" style="width: 14em; margin: 0 6px;"/>
      <html:span id="ztts-voices-speed-value" style="min-width: 3em;">1.0×</html:span>
    </hbox>
    <!-- Each column is position: relative — the offsetParent of its entries —
         so ui/voice-browser-rows.ts can scroll it to the selection (issue #33) -->
    <html:div id="ztts-voices-browser" style="display: flex; gap: 8px; margin-top: 4px; max-width: 54em;">
      <html:div id="ztts-voices-tiers"
                style="position: relative; width: 9em; flex-shrink: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
      <html:div id="ztts-voices-locales"
                style="position: relative; width: 15em; flex-shrink: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
      <html:div id="ztts-voices-list"
                style="position: relative; flex: 1; min-width: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
    </html:div>
    <hbox align="center">
      <description id="ztts-voices-status"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-reading"/></label>
    <!-- The pref keeps its old name (settings backups carry it); off, Zotero
         keeps a voice per document language (read-aloud/memory-sync.ts) -->
    <hbox align="center">
      <checkbox data-l10n-id="ztts-one-voice"
                preference="extensions.zotero.zotero-tts.readAloud.sameForAllDocuments"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-one-voice" data-l10n-attrs="help"/>
    </hbox>
    <!-- Off, Zotero keeps a speed per document language and the voice
         browser's slider drives the samples only (read-aloud/default-speed.ts) -->
    <hbox align="center">
      <checkbox data-l10n-id="ztts-one-speed"
                preference="extensions.zotero.zotero-tts.readAloud.globalSpeed"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-one-speed" data-l10n-attrs="help"/>
    </hbox>
    <!-- The gap before the next sentence, for every voice in the player, at
         1× speed; the paragraph row is added on top where a paragraph begins
         (read-aloud/pauses.ts, issue #44). A switch off leaves that part to
         Zotero. Both bound: the settings never edit the voice list, so no
         reading guard (issue #11) -->
    <hbox align="center">
      <checkbox data-l10n-id="ztts-sentence-pause"
                preference="extensions.zotero.zotero-tts.readAloud.sentenceDelayEnabled"/>
      <html:input type="number" min="0" max="5000" step="50" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.readAloud.sentenceDelayMs"/>
      <label data-l10n-id="ztts-pause-ms"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-sentence-pause" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <checkbox data-l10n-id="ztts-paragraph-pause"
                preference="extensions.zotero.zotero-tts.readAloud.paragraphDelayEnabled"/>
      <html:input type="number" min="0" max="5000" step="50" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.readAloud.paragraphDelayMs"/>
      <label data-l10n-id="ztts-pause-ms"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-paragraph-pause" data-l10n-attrs="help"/>
    </hbox>
    <!-- The switch locks the cache below on: without it the warmer has
         nowhere to put what it synthesizes (ui/prefetch-rows.ts) -->
    <hbox align="center">
      <checkbox data-l10n-id="ztts-prefetch" preference="extensions.zotero.zotero-tts.prefetchEnabled"/>
      <html:input type="number" min="1" max="10" step="1"
                  preference="extensions.zotero.zotero-tts.prefetch"/>
      <label data-l10n-id="ztts-prefetch-ahead"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-prefetch" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <checkbox id="ztts-cache-audio" data-l10n-id="ztts-cache-audio" preference="extensions.zotero.zotero-tts.cacheAudio"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-cache-audio" data-l10n-attrs="help"/>
    </hbox>
  </groupbox>

  <!-- Zotero's Read Aloud highlight colors, applied per reader by read-aloud/highlight-style.ts;
       the preview and the Restore button are wired by ui/highlight-rows.ts -->
  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-highlight"/></label>
    <hbox align="center">
      <label data-l10n-id="ztts-highlight-word" style="width: 8em"/>
      <html:input id="ztts-highlight-wordColor" type="color" preference="extensions.zotero.zotero-tts.highlight.wordColor"/>
      <label data-l10n-id="ztts-highlight-opacity" style="margin-inline-start: 1em"/>
      <html:input id="ztts-highlight-wordAlpha" type="number" min="0" max="100" step="5" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.highlight.wordAlpha"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-highlight-sentence" style="width: 8em"/>
      <html:input id="ztts-highlight-sentenceColor" type="color" preference="extensions.zotero.zotero-tts.highlight.sentenceColor"/>
      <label data-l10n-id="ztts-highlight-opacity" style="margin-inline-start: 1em"/>
      <html:input id="ztts-highlight-sentenceAlpha" type="number" min="0" max="100" step="5" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.highlight.sentenceAlpha"/>
    </hbox>
    <hbox align="center">
      <checkbox id="ztts-highlight-sentenceUnderWord" data-l10n-id="ztts-sentence-under-word"
                preference="extensions.zotero.zotero-tts.highlight.sentenceUnderWord"/>
    </hbox>
    <!-- A sample page in the reader's current theme, blended as the reader blends its highlights;
         highlight-rows.ts paints it, this style is the fallback until it does. Each line's text is
         one message whose spans are these elements, matched by data-l10n-name, so the ids the
         painter looks up survive the translation. -->
    <html:div id="ztts-highlight-preview"
              style="background: #fff; color: #121212; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 8px 12px; margin: 6px 0; max-width: 40em; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.7;">
      <html:div data-l10n-id="ztts-preview-sentence-line"><html:span data-l10n-name="tag" style="color: #888; font-family: sans-serif; font-size: 11px; margin-inline-end: 0.6em;"/><html:span id="ztts-highlight-preview-sentence" data-l10n-name="active"/></html:div>
      <html:div data-l10n-id="ztts-preview-word-line"><html:span data-l10n-name="tag" style="color: #888; font-family: sans-serif; font-size: 11px; margin-inline-end: 0.6em;"/><html:span id="ztts-highlight-preview-word-before" data-l10n-name="before"/><html:span id="ztts-highlight-preview-word" data-l10n-name="word"/><html:span id="ztts-highlight-preview-word-after" data-l10n-name="after"/></html:div>
    </html:div>
    <hbox>
      <button id="ztts-highlight-defaults" data-l10n-id="ztts-restore-colors"/>
    </hbox>
  </groupbox>

  <!-- These rows are not bound with preference=; shortcut-rows.ts records
       key presses and writes the prefs itself. The ? at the end of a row
       says what the key does outside a Read Aloud session (hover); the
       speed keys work in every state and have none. -->
  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-shortcuts"/></label>
    <hbox align="center">
      <label data-l10n-id="ztts-key-speed-reset" style="width: 12em"/>
      <button id="ztts-key-speedReset" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedReset" data-l10n-id="ztts-clear"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-slower" style="width: 12em"/>
      <button id="ztts-key-speedDown" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedDown" data-l10n-id="ztts-clear"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-faster" style="width: 12em"/>
      <button id="ztts-key-speedUp" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedUp" data-l10n-id="ztts-clear"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-previous-sentence" style="width: 12em"/>
      <button id="ztts-key-previousSentence" style="min-width: 10em"/>
      <button id="ztts-key-clear-previousSentence" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-skip" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-next-sentence" style="width: 12em"/>
      <button id="ztts-key-nextSentence" style="min-width: 10em"/>
      <button id="ztts-key-clear-nextSentence" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-skip" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-previous-paragraph" style="width: 12em"/>
      <button id="ztts-key-previousParagraph" style="min-width: 10em"/>
      <button id="ztts-key-clear-previousParagraph" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-skip" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-next-paragraph" style="width: 12em"/>
      <button id="ztts-key-nextParagraph" style="min-width: 10em"/>
      <button id="ztts-key-clear-nextParagraph" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-skip" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-play" style="width: 12em"/>
      <button id="ztts-key-startFromSelection" style="min-width: 10em"/>
      <button id="ztts-key-clear-startFromSelection" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-play" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-return" style="width: 12em"/>
      <button id="ztts-key-returnToSpoken" style="min-width: 10em"/>
      <button id="ztts-key-clear-returnToSpoken" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-return" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-key-options" style="width: 12em"/>
      <button id="ztts-key-toggleOptions" style="min-width: 10em"/>
      <button id="ztts-key-clear-toggleOptions" data-l10n-id="ztts-clear"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-key-options" data-l10n-attrs="help"/>
    </hbox>
    <description id="ztts-key-message"/>
    <hbox>
      <button id="ztts-key-defaults" data-l10n-id="ztts-restore-shortcuts"/>
    </hbox>
  </groupbox>

  <!-- backup-rows.ts: manual snapshots as files — the settings as one JSON,
       the reading positions as another. Restoring settings overwrites;
       importing positions merges. -->
  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-backup"/></label>
    <hbox align="center">
      <button id="ztts-backup" data-l10n-id="ztts-backup-settings"/>
      <button id="ztts-restore" data-l10n-id="ztts-restore-settings"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-positions-export" data-l10n-id="ztts-export-positions"/>
      <button id="ztts-positions-import" data-l10n-id="ztts-import-positions"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-positions" data-l10n-attrs="help"/>
    </hbox>
    <description id="ztts-backup-message"/>
  </groupbox>

  <!-- webdav-rows.ts: the WebDAV folder both automatic transports use —
       reading positions both ways (#40), this machine's settings file up
       (#41, settings-autoupload.ts). The URL's placeholder is an example
       address, the same in every language. -->
  <groupbox>
    <label><html:h2 data-l10n-id="ztts-heading-sync"/></label>
    <hbox align="center">
      <label data-l10n-id="ztts-field-webdav-url" style="width: 8em"/>
      <html:input type="text" placeholder="https://dav.example.com/zotero-tts/" preference="extensions.zotero.zotero-tts.webdav.url"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-username" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.webdav.username"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-password" style="width: 8em"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.webdav.password"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="ztts-field-this-computer" style="width: 8em"/>
      <html:input id="ztts-webdav-machine-id" type="text"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-this-computer" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <checkbox id="ztts-webdav-sync-positions" data-l10n-id="ztts-sync-positions" preference="extensions.zotero.zotero-tts.webdav.syncPositions"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-sync-positions" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <checkbox id="ztts-webdav-auto-upload" data-l10n-id="ztts-auto-upload" preference="extensions.zotero.zotero-tts.webdav.autoUploadSettings"/>
      <label class="ztts-help" value="?" data-l10n-id="ztts-help-auto-upload" data-l10n-attrs="help"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-webdav-upload" data-l10n-id="ztts-upload-now"/>
      <button id="ztts-webdav-download" data-l10n-id="ztts-restore-from-server"/>
