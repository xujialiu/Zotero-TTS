<!-- Initialization must hang off this onload, not off a pane script:
     Zotero runs pane `scripts` BEFORE it parses and inserts this fragment
     (preferences.js: loadSubScript, then parseXULToFragment / append),
     and only afterwards dispatches a `load` event to the fragment's root.
     A script would find none of these elements. -->
<vbox onload="Zotero.ZoteroTTS.prefsPane.onPaneLoad(document)">
  <groupbox>
    <label><html:h2>Provider</html:h2></label>
    <radiogroup id="ztts-provider" preference="extensions.zotero.zotero-tts.provider">
      <radio value="openai" label="OpenAI"/>
      <radio value="azure" label="Azure"/>
      <radio value="local" label="Local"/>
    </radiogroup>
    <description id="ztts-capability"/>
    <description>In the Read Aloud popup, this provider's voices are listed under the "Local" tier, prefixed "Zotero TTS". Zotero's own Standard and Premium voices stay available.</description>

    <hbox align="center">
      <label value="OpenAI API key"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.openai.apiKey"/>
    </hbox>
    <hbox align="center">
      <label value="OpenAI base URL"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.openai.baseURL"/>
    </hbox>
    <hbox align="center">
      <label value="OpenAI model"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.openai.model"/>
    </hbox>

    <hbox align="center">
      <label value="Azure API key"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.azure.apiKey"/>
    </hbox>
    <hbox align="center">
      <label value="Azure region"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.azure.region"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Local engine</html:h2></label>
    <hbox align="center">
      <label value="Engine"/>
      <menulist id="ztts-engine" preference="extensions.zotero.zotero-tts.local.engine">
        <menupopup id="ztts-engine-popup"/>
      </menulist>
    </hbox>
    <hbox align="center">
      <label value="Address"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.local.baseURL"/>
      <button id="ztts-test" label="Test connection"/>
    </hbox>
    <description id="ztts-test-result"/>
  </groupbox>

  <groupbox>
    <label><html:h2>Reading</html:h2></label>
    <hbox align="center">
      <label value="Speed"/>
      <html:input type="number" min="0.5" max="3" step="0.1"
                  preference="extensions.zotero.zotero-tts.speed"/>
    </hbox>
    <hbox align="center">
      <label value="Prefetch (sentences)"/>
      <html:input type="number" min="1" max="10" step="1"
                  preference="extensions.zotero.zotero-tts.prefetch"/>
    </hbox>
    <hbox align="center">
      <checkbox label="Cache synthesized audio" preference="extensions.zotero.zotero-tts.cacheAudio"/>
    </hbox>
  </groupbox>

  <!-- These rows are not bound with preference=; shortcut-rows.ts records
       key presses and writes the prefs itself. -->
  <groupbox>
    <label><html:h2>Keyboard shortcuts</html:h2></label>
    <description>Change Zotero's Read Aloud playback speed (the slider in the Read Aloud popup) while reading. Click a shortcut, then press the new key combination. Esc cancels, Backspace clears.</description>
    <hbox align="center">
      <label value="Reset speed to 1.0×" style="width: 12em"/>
      <button id="ztts-key-speedReset" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedReset" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Slower (−0.1×)" style="width: 12em"/>
      <button id="ztts-key-speedDown" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedDown" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Faster (+0.1×)" style="width: 12em"/>
      <button id="ztts-key-speedUp" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedUp" label="Clear"/>
    </hbox>
    <description id="ztts-key-message"/>
    <hbox>
      <button id="ztts-key-defaults" label="Restore default shortcuts"/>
    </hbox>
  </groupbox>
</vbox>
