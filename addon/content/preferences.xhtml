<!-- Initialization must hang off this onload, not off a pane script:
     Zotero runs pane `scripts` BEFORE it parses and inserts this fragment
     (preferences.js: loadSubScript, then parseXULToFragment / append),
     and only afterwards dispatches a `load` event to the fragment's root.
     A script would find none of these elements. -->
<vbox onload="Zotero.ZoteroTTS.prefsPane.onPaneLoad(document)">
  <groupbox>
    <label><html:h2>OpenAI</html:h2></label>
    <checkbox label="Enable OpenAI voices" preference="extensions.zotero.zotero-tts.openai.enabled"/>
    <!-- Not bound with preference=: server-preset-rows.ts writes the choice
         and the preset's defaults, and grays out the fields the server ignores. -->
    <hbox align="center">
      <label value="Server" style="width: 8em"/>
      <menulist id="ztts-openai-server">
        <menupopup>
          <menuitem value="openai" label="OpenAI"/>
          <menuitem value="chatterbox" label="Chatterbox-TTS-Server"/>
          <menuitem value="other" label="Other OpenAI-compatible server"/>
        </menupopup>
      </menulist>
    </hbox>
    <description id="ztts-openai-server-note"/>
    <hbox align="center">
      <label value="API key" style="width: 8em"/>
      <html:input id="ztts-openai-apiKey" type="password" preference="extensions.zotero.zotero-tts.openai.apiKey"/>
    </hbox>
    <hbox align="center">
      <label value="Base URL" style="width: 8em"/>
      <html:input id="ztts-openai-baseURL" type="text" preference="extensions.zotero.zotero-tts.openai.baseURL"/>
    </hbox>
    <!-- Free text: any OpenAI-compatible server names its models as it
         likes. Test connection fills the datalist with the server's list. -->
    <hbox align="center">
      <label value="Model" style="width: 8em"/>
      <html:input id="ztts-openai-model" type="text" list="ztts-openai-models" preference="extensions.zotero.zotero-tts.openai.model"/>
      <html:datalist id="ztts-openai-models"/>
    </hbox>
    <hbox align="center">
      <label value="Voices" style="width: 8em"/>
      <html:input id="ztts-openai-voices" type="text" placeholder="auto-detect" preference="extensions.zotero.zotero-tts.openai.voices"/>
    </hbox>
    <!-- For a gateway in front of a keyless server, e.g. a Cloudflare Access
         service token: "CF-Access-Client-Id: ...; CF-Access-Client-Secret: ..." -->
    <hbox align="center">
      <label value="Extra headers" style="width: 8em"/>
      <html:input id="ztts-openai-headers" type="text" placeholder="Name: value; Name: value" preference="extensions.zotero.zotero-tts.openai.headers"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-test-openai" label="Test connection"/>
      <description id="ztts-test-result-openai"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Azure</html:h2></label>
    <checkbox label="Enable Azure voices" preference="extensions.zotero.zotero-tts.azure.enabled"/>
    <hbox align="center">
      <label value="API key" style="width: 8em"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.azure.apiKey"/>
    </hbox>
    <hbox align="center">
      <label value="Region" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.azure.region"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-test-azure" label="Test connection"/>
      <description id="ztts-test-result-azure"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Local engine</html:h2></label>
    <!-- One block per engine: its own enable switch and address. Only
         Kokoro exists today; the checkbox label is filled from the engine
         registry in onPaneLoad. -->
    <checkbox id="ztts-local-enable" label="Enable Kokoro-FastAPI" preference="extensions.zotero.zotero-tts.local.enabled"/>
    <hbox align="center">
      <label value="Address" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.local.baseURL"/>
    </hbox>
    <!-- Same format as the OpenAI section's: for a gateway in front of the
         server, e.g. a Cloudflare Access service token. -->
    <hbox align="center">
      <label value="Extra headers" style="width: 8em"/>
      <html:input type="text" placeholder="Name: value; Name: value" preference="extensions.zotero.zotero-tts.local.headers"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-test-local" label="Test connection"/>
      <description id="ztts-test-result-local"/>
    </hbox>
  </groupbox>

  <!-- Every voice the enabled providers publish, grouped by language, with a
       sample player and favorites; wired by ui/voice-browser-rows.ts. -->
  <groupbox>
    <label><html:h2>Voice browser</html:h2></label>
    <hbox align="center">
      <checkbox label="Offer only favorite voices in the Read Aloud popup"
                preference="extensions.zotero.zotero-tts.readAloud.favoritesOnly"/>
    </hbox>
    <html:div id="ztts-voices-browser" style="display: flex; gap: 8px; margin-top: 4px; max-width: 54em;">
      <html:div id="ztts-voices-tiers"
                style="width: 9em; flex-shrink: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
      <html:div id="ztts-voices-locales"
                style="width: 15em; flex-shrink: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
      <html:div id="ztts-voices-list"
                style="flex: 1; min-width: 0; height: 16em; overflow-y: auto; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 2px;"/>
    </html:div>
    <hbox align="center">
      <button id="ztts-voices-reload" label="Reload voices"/>
      <description id="ztts-voices-status"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Reading</html:h2></label>
    <hbox align="center">
      <checkbox label="Use the same voice and speed for every document"
                preference="extensions.zotero.zotero-tts.readAloud.sameForAllDocuments"/>
    </hbox>
    <hbox align="center">
      <checkbox label="Hide Zotero’s own Local voices (the plugin’s voices then drop their TTS- prefix)"
                preference="extensions.zotero.zotero-tts.readAloud.hideZoteroLocalVoices"/>
    </hbox>
    <hbox align="center">
      <checkbox label="Prefetch upcoming sentences" preference="extensions.zotero.zotero-tts.prefetchEnabled"/>
      <html:input type="number" min="1" max="10" step="1"
                  preference="extensions.zotero.zotero-tts.prefetch"/>
      <label value="ahead"/>
    </hbox>
    <hbox align="center">
      <checkbox label="Cache synthesized audio" preference="extensions.zotero.zotero-tts.cacheAudio"/>
    </hbox>
  </groupbox>

  <!-- Zotero's Read Aloud highlight colors, applied per reader by read-aloud/highlight-style.ts;
       the preview and the Restore button are wired by ui/highlight-rows.ts -->
  <groupbox>
    <label><html:h2>Highlight</html:h2></label>
    <hbox align="center">
      <label value="Word" style="width: 8em"/>
      <html:input id="ztts-highlight-wordColor" type="color" preference="extensions.zotero.zotero-tts.highlight.wordColor"/>
      <label value="Opacity (%)" style="margin-inline-start: 1em"/>
      <html:input id="ztts-highlight-wordAlpha" type="number" min="0" max="100" step="5" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.highlight.wordAlpha"/>
    </hbox>
    <hbox align="center">
      <label value="Sentence" style="width: 8em"/>
      <html:input id="ztts-highlight-sentenceColor" type="color" preference="extensions.zotero.zotero-tts.highlight.sentenceColor"/>
      <label value="Opacity (%)" style="margin-inline-start: 1em"/>
      <html:input id="ztts-highlight-sentenceAlpha" type="number" min="0" max="100" step="5" style="width: 5em"
                  preference="extensions.zotero.zotero-tts.highlight.sentenceAlpha"/>
    </hbox>
    <hbox align="center">
      <checkbox id="ztts-highlight-sentenceUnderWord" label="While highlighting words, keep the sentence highlighted too"
                preference="extensions.zotero.zotero-tts.highlight.sentenceUnderWord"/>
    </hbox>
    <!-- A sample page in the reader's current theme, blended as the reader blends its highlights;
         highlight-rows.ts paints it, this style is the fallback until it does -->
    <html:div id="ztts-highlight-preview"
              style="background: #fff; color: #121212; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 8px 12px; margin: 6px 0; max-width: 40em; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.7;">
      <html:div><html:span style="color: #888; font-family: sans-serif; font-size: 11px; margin-inline-end: 0.6em;">Sentence mode</html:span>The first sentence has been read. <html:span id="ztts-highlight-preview-sentence">Read Aloud is now on this sentence.</html:span> The next one follows.</html:div>
      <html:div><html:span style="color: #888; font-family: sans-serif; font-size: 11px; margin-inline-end: 0.6em;">Word mode</html:span>The first sentence has been read. <html:span id="ztts-highlight-preview-word-before">Read Aloud is now on </html:span><html:span id="ztts-highlight-preview-word">this</html:span><html:span id="ztts-highlight-preview-word-after"> word.</html:span> The next one follows.</html:div>
    </html:div>
    <hbox>
      <button id="ztts-highlight-defaults" label="Restore default colors"/>
    </hbox>
  </groupbox>

  <!-- These rows are not bound with preference=; shortcut-rows.ts records
       key presses and writes the prefs itself. -->
  <groupbox>
    <label><html:h2>Keyboard shortcuts</html:h2></label>
    <hbox align="center">
      <label value="Reset speed to 1.0×" style="width: 12em"/>
      <button id="ztts-key-speedReset" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedReset" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Slower (−0.1×)" style="width: 12em"/>
      <button id="ztts-key-speedDown" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedDown" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Faster (+0.1×)" style="width: 12em"/>
      <button id="ztts-key-speedUp" style="min-width: 10em"/>
      <button id="ztts-key-clear-speedUp" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Previous sentence" style="width: 12em"/>
      <button id="ztts-key-previousSentence" style="min-width: 10em"/>
      <button id="ztts-key-clear-previousSentence" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Next sentence" style="width: 12em"/>
      <button id="ztts-key-nextSentence" style="min-width: 10em"/>
      <button id="ztts-key-clear-nextSentence" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Previous paragraph" style="width: 12em"/>
      <button id="ztts-key-previousParagraph" style="min-width: 10em"/>
      <button id="ztts-key-clear-previousParagraph" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Next paragraph" style="width: 12em"/>
      <button id="ztts-key-nextParagraph" style="min-width: 10em"/>
      <button id="ztts-key-clear-nextParagraph" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Read from selection" style="width: 12em"/>
      <button id="ztts-key-startFromSelection" style="min-width: 10em"/>
      <button id="ztts-key-clear-startFromSelection" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Go to reading position" style="width: 12em"/>
      <button id="ztts-key-returnToSpoken" style="min-width: 10em"/>
      <button id="ztts-key-clear-returnToSpoken" label="Clear"/>
    </hbox>
    <hbox align="center">
      <label value="Resume where it stopped" style="width: 12em"/>
      <button id="ztts-key-resumeLastPosition" style="min-width: 10em"/>
      <button id="ztts-key-clear-resumeLastPosition" label="Clear"/>
    </hbox>
    <description>Sentence, paragraph and Go-to-reading-position keys act only while Read Aloud is open, and Read from selection only while text is selected; otherwise the keys page and scroll the reader as usual.</description>
    <description id="ztts-key-message"/>
    <hbox>
      <button id="ztts-key-defaults" label="Restore default shortcuts"/>
    </hbox>
  </groupbox>

  <!-- backup-rows.ts: every setting above as one JSON file, and back. -->
  <groupbox>
    <label><html:h2>Backup</html:h2></label>
    <hbox align="center">
      <button id="ztts-backup" label="Backup settings…"/>
      <button id="ztts-restore" label="Restore settings…"/>
    </hbox>
    <description id="ztts-backup-message"/>
    <!-- The same file, kept in a WebDAV folder so it travels between machines (webdav-rows.ts) -->
    <hbox align="center">
      <label value="WebDAV URL" style="width: 8em"/>
      <html:input type="text" placeholder="https://dav.example.com/zotero-tts/" preference="extensions.zotero.zotero-tts.webdav.url"/>
    </hbox>
    <hbox align="center">
      <label value="Username" style="width: 8em"/>
      <html:input type="text" preference="extensions.zotero.zotero-tts.webdav.username"/>
    </hbox>
    <hbox align="center">
      <label value="Password" style="width: 8em"/>
      <html:input type="password" preference="extensions.zotero.zotero-tts.webdav.password"/>
    </hbox>
    <hbox align="center">
      <button id="ztts-webdav-upload" label="Upload to WebDAV"/>
      <button id="ztts-webdav-download" label="Download from WebDAV…"/>
      <button id="ztts-webdav-test" label="Test connection"/>
    </hbox>
    <description id="ztts-webdav-message"/>
  </groupbox>
</vbox>
